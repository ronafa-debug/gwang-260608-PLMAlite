# PLMA Lite Supabase configuration
# https://supabase.com/docs/guides/cli/config

project_id = "plma-lite"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[functions.generate-storytelling]
verify_jwt = false

[functions.generate-diary]
verify_jwt = false
